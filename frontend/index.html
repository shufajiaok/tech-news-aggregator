<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPulse — 科技新闻聚合</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">TechPulse</span>
            </a>
            <nav class="nav" id="categoryNav">
                <button class="nav-item active" data-category="">全部</button>
                <button class="nav-item" data-category="AI">🤖 AI</button>
                <button class="nav-item" data-category="GPU">🎮 GPU</button>
                <button class="nav-item" data-category="CPU">💻 CPU</button>
                <button class="nav-item" data-category="Foundry">🏭 代工</button>
                <button class="nav-item" data-category="Semiconductor">🔬 半导体</button>
                <button class="nav-item" data-category="Digital">📱 数码</button>
            </nav>
            <button class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">🌙</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在加载最新科技新闻...</p>
        </div>

        <!-- Error -->
        <div class="error" id="error" style="display:none;">
            <p>⚠️ 加载失败，请检查API连接后刷新页面</p>
        </div>

        <!-- News Grid -->
        <div class="news-grid" id="newsGrid"></div>

        <!-- Empty State -->
        <div class="empty" id="empty" style="display:none;">
            <p>📭 该分类暂无新闻</p>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination" style="display:none;">
            <button id="prevBtn" disabled>← 上一页</button>
            <span id="pageInfo">第 1 页</span>
            <button id="nextBtn">下一页 →</button>
        </div>
    </main>

    <!-- News Detail Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>TechPulse — 来自 X 平台的科技新闻聚合 | 数据每日自动更新</p>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
