<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>微博画廊 · 动态与壁纸</title>
<meta name="description" content="微博动态流与 16:9 高清壁纸：缩略图走 CDN 代理，原图实时向微博取回。">
<meta name="theme-color" content="#0a0c10">
<link rel="stylesheet" href="glass/liquid-glass.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 玻璃折射的纹理来源：自托管的压暗壁纸底，按 cover / center top 对齐 -->
<div class="site-backdrop" aria-hidden="true" data-glass-source="/bg.jpg"></div>
<canvas class="glass-layer" id="glassLayer" hidden aria-hidden="true"></canvas>

<nav class="nav" id="nav" aria-label="页面切换">
  <span class="nav__lens" aria-hidden="true"></span>
  <div class="glass__content">
    <a href="#feed" data-page="feed" class="active" aria-current="page">动态</a>
    <a href="#wall" data-page="wall">壁纸</a>
  </div>
</nav>

<main>
  <!-- ───────── 动态流 ───────── -->
  <section class="page" id="page-feed" aria-label="最新动态">
    <header class="page-head">
      <h1>最新动态</h1>
      <p class="sub" id="feedSub">载入中…</p>
      <div class="chips" id="feedChips"></div>
    </header>
    <div class="feed" id="feedList"></div>
    <div class="sentinel" id="feedSentinel"></div>
    <div class="empty" id="feedEmpty" hidden>还没有动态</div>
  </section>

  <!-- ───────── 壁纸 ───────── -->
  <section class="page" id="page-wall" aria-label="壁纸" hidden>
    <header class="page-head">
      <h1>壁纸</h1>
      <p class="sub" id="wallSub">载入中…</p>
      <div class="chips" id="wallChips"></div>
      <div class="chips dim" id="sortChips"></div>
    </header>
    <div class="grid" id="grid"></div>
    <div class="sentinel" id="wallSentinel"></div>
    <div class="empty" id="wallEmpty" hidden>没有符合条件的图片</div>
  </section>
</main>

<!-- 抓取控制台：全站唯一的 Studio 折射卡片 -->
<button class="fab" id="fab" aria-label="打开抓取控制台" aria-expanded="false">⌘</button>

<aside class="console card" id="console" hidden aria-label="抓取控制台">
  <div class="con-head">
    <span class="con-title">抓取控制台</span>
    <button class="con-close" id="conClose" aria-label="关闭">✕</button>
  </div>

  <section class="con-sec">
    <label class="con-label" for="qInput">抓谁</label>
    <div class="con-row">
      <input id="qInput" type="text" placeholder="不渝uyuna / 白泠最近的图 / 主页链接" autocomplete="off" spellcheck="false">
      <button class="btn" id="qGo">开始</button>
    </div>
    <p class="con-hint" id="qHint">大模型会对照资料库里的图鉴名册把人认准。地偶昵称是「中文名+罗马音_团名」，写成「不渝uyuna」最稳；实在搜不到就直接粘微博主页链接</p>
  </section>

  <section class="con-sec">
    <label class="con-label">GitHub PAT <span class="tag" id="patState">未设置</span></label>
    <div class="con-row">
      <input id="patInput" type="password" placeholder="ghp_… 需要 repo + workflow" autocomplete="off">
      <button class="btn" id="patSave">保存</button>
    </div>
    <p class="con-hint">只存这台浏览器，用于写 Secret 和触发抓取</p>
  </section>

  <section class="con-sec">
    <label class="con-label">微博 Cookie <span class="tag" id="ckState">未设置</span></label>
    <textarea id="ckInput" rows="3" placeholder="SUB=…; SUBP=…; 粘贴整条" spellcheck="false"></textarea>
    <div class="con-row end">
      <button class="btn ghost" id="ckClear">清空 Secret</button>
      <button class="btn" id="ckSave">加密写入</button>
    </div>
    <p class="con-hint">浏览器本地用仓库公钥加密后直传 GitHub，不经过本站服务器</p>
  </section>

  <section class="con-sec">
    <label class="con-label">大模型 API Key <span class="tag" id="llmState">未设置</span></label>
    <div class="con-row">
      <input id="llmInput" type="password" placeholder="sk-…（阿里云百炼）" autocomplete="off">
      <select id="llmModel" aria-label="模型">
        <option value="qwen-plus">qwen-plus</option>
        <option value="qwen-max">qwen-max</option>
        <option value="qwen-turbo">qwen-turbo</option>
        <option value="qwen-long">qwen-long</option>
      </select>
    </div>
    <div class="con-row end">
      <button class="btn ghost" id="llmClear">清空 Secret</button>
      <button class="btn" id="llmSave">加密写入</button>
    </div>
    <p class="con-hint">写入 WB_LLM_KEY / MODEL / BASE_URL，供 Action 解析「白泠最近的图」这类说法</p>
  </section>

  <div class="con-status" id="conStatus" role="status">—</div>
</aside>

<!-- 灯箱 -->
<div class="lb" id="lb" hidden>
  <button class="lb-close" id="lbClose" aria-label="关闭">✕</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="上一张">‹</button>
  <button class="lb-nav next" id="lbNext" aria-label="下一张">›</button>
  <div class="lb-stage">
    <div class="lb-spinner" id="lbSpinner"><i></i><span>载入大图…</span></div>
    <img id="lbImg" alt="">
  </div>
  <div class="lb-bar glass-css" id="lbBar">
    <div class="lb-meta">
      <strong id="lbOwner"></strong>
      <span id="lbDim"></span>
    </div>
    <div class="lb-actions">
      <a id="lbPost" target="_blank" rel="noopener">原微博 ↗</a>
      <a id="lbOpen" target="_blank" rel="noopener">原图 ↗</a>
    </div>
  </div>
</div>

<footer class="foot">
  <span id="footStat">—</span>
</footer>

<script id="glass-config" type="application/json">{"material":{"blurRadius":2,"tintAlpha":0.55,"refDispersion":21},"geometry":{"card":{"radius":28}},"nav":{"navEdge":16,"navRefraction":5.5,"navFill":0.34,"navBlur":3}}</script>
<script type="module" src="glass/liquid-glass.js"></script>
<script src="vendor/nacl.min.js"></script>
<script src="app.js"></script>
</body>
</html>
