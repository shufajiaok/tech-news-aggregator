name: 壁纸画廊增量

# 只产出元数据，不落地任何图片：
#   frontend/wallpaper/data.json —— 壁纸页（16:9 / >=2MB / 宽>=1920）
#   frontend/wallpaper/feed.json —— 动态流（本次抓到的全部图，不筛比例）
# 缩略图与原图都由站点的 /i/<档位>/<key> 实时代理微博 CDN。

on:
  schedule:
    # UTC 19:30 = 北京时间 03:30，避开微博白天风控高峰
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      q:
        description: '自然语言（如「白泠最近的图」），由大模型解析，优先级最高'
        required: false
        default: ''
      names:
        description: '账号昵称（逗号分隔），留空跑完整名单'
        required: false
        default: ''
      uids:
        description: '只跑指定 uid（逗号分隔）'
        required: false
        default: ''
      pages:
        description: '登录态下每号翻几页'
        required: false
        default: '6'
      max_new:
        description: '壁纸最多追加多少张（0 = 不限）'
        required: false
        default: '0'
      dry_run:
        description: '只统计不写文件'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weibo-gallery
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow playwright
          python -m playwright install --with-deps chromium

      - name: 增量抓取（只出元数据）
        env:
          # 可选：填了就走登录态（能翻页、能看到仅粉丝可见的正文流）
          WB_COOKIE: ${{ secrets.WB_COOKIE }}
          # 自然语言解析用（默认阿里云百炼 qwen-plus，OpenAI 兼容接口）
          WB_LLM_KEY: ${{ secrets.WB_LLM_KEY }}
          WB_LLM_BASE_URL: ${{ secrets.WB_LLM_BASE_URL }}
          WB_LLM_MODEL: ${{ secrets.WB_LLM_MODEL }}
        run: |
          python tools/cloud_build.py \
            --q "${{ inputs.q }}" \
            --names "${{ inputs.names }}" \
            --uids "${{ inputs.uids }}" \
            --pages "${{ inputs.pages || 6 }}" \
            --max-new "${{ inputs.max_new || 0 }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 提交索引
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          files=""
          for f in frontend/wallpaper/data.json frontend/wallpaper/feed.json; do
            if [[ -n $(git status --porcelain "$f") ]]; then files="$files $f"; fi
          done
          if [[ -n "$files" ]]; then
            git add $files
            git commit -m "chore(wallpaper): 增量更新索引 $(date -u +%FT%TZ)"
            git push
          else
            echo "索引无变化，跳过提交"
          fi
